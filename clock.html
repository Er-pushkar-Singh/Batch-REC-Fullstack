<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLock</title>
</head>
<body>
    <h1 id="india">India : <p>00:00</p></h1>
    <h1 id="russia">Russia : <p>17:09</p></h1>
    <h1 id="america">America : <p>17:09</p></h1>
    <script>
        function fetchTime(){
            const d = new Date();
            // console.log(d);
            let ind = d.toLocaleString('en-us',{
                timZone:'Asia/Kolkata'
            })
            let russia = d.toLocaleString('en-us',{
                timeZone:"Europe/Moscow"
            }) 
            let america = d.toLocaleString('en-us',{
                timeZone:"America/Los_Angeles"
            })
            document.getElementById('india').innerHTML=ind
            document.getElementById('russia').innerHTML=russia
            document.getElementById('america').innerHTML=america
        }                                                                                                                
        setInterval(()=>{                      
            fetchTime()
        },1000)
   
    </script>
</body>
</html>
