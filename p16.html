<script>
// wap to check a string is palindrome or not 
// Ex - madam => madam
let str = "madam";
let str2 = "";
for(i=str.length-1;i>=0;i--){
	str2 = str2+str[i];
}
if(str==str2){
console.log("String is palindrome")
}else{
console.log("String is not palindrome")
}

</script>
