<html>
<head>
<script>
// wap to count alphabate , number , special charecters .
let str = "Hello@#1233";
let n=0;
let al =0;
let s =0;

for(i=0;i<str.length;i++){
	if((str[i]>='a' && str[i]<='z') || (str[i]>='A' && str[i]<='Z')){
		al = al+1;
	}else if(str[i]>='0' && str[i]<='9'){
		n = n+1;
	}else{
	s = s+1;
	}
}
console.log("Total Alphabate is : "+al);
console.log("Total Number is : "+n);
console.log("Total Special Charecter is : "+s);

</script>
</head>
