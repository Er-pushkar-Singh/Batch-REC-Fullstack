<script>
// wap to print the table of 5 
// wap to print the prime in range 
let n = 100;

for(let i = 50;i<=n;i++){
let c = 0
	for(let j=1;j<=i;j++){
		if(i%j==0){
		c =c +1
		}
	}
	if(c==2){
	console.log(i+" Number is prime")
	}else{
	console.log(i+" Number is not prime")
	}
}
</script>
